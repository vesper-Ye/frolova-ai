<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>弗洛洛</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Times New Roman', 'Microsoft YaHei', serif; background-color: #0a0505; display: flex; }

        /* 左侧话题侧边栏 */
        .sidebar {
            width: 0; height: 100vh; background: rgba(15, 5, 5, 0.85); backdrop-filter: blur(15px);
            border-right: 1px solid rgba(200, 60, 60, 0.2); transition: width 0.4s ease;
            overflow: hidden; display: flex; flex-direction: column; z-index: 50;
        }
        .sidebar.open { width: 260px; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid rgba(200, 60, 60, 0.2); white-space: nowrap; }
        .new-topic-btn {
            width: 100%; padding: 12px; background: rgba(180, 30, 30, 0.6); border: 1px solid rgba(255, 100, 100, 0.4);
            border-radius: 8px; color: #fff; cursor: pointer; transition: 0.3s; font-size: 14px; letter-spacing: 2px;
        }
        .new-topic-btn:hover { background: rgba(220, 50, 50, 0.8); }
        
        .topic-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .topic-list::-webkit-scrollbar { width: 4px; }
        .topic-list::-webkit-scrollbar-thumb { background: rgba(200,60,60,0.4); border-radius: 2px; }
        .topic-item {
            padding: 12px 15px; border-radius: 8px; color: #ccc; font-size: 13px; cursor: pointer; transition: 0.2s;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 1px solid transparent; min-width: 220px;
        }
        .topic-item:hover { background: rgba(255, 255, 255, 0.05); }
        .topic-item.active { background: rgba(180, 30, 30, 0.3); color: #fff; border-color: rgba(255, 100, 100, 0.4); }

        .toggle-sidebar-btn {
            position: absolute; left: 20px; top: 20px; z-index: 60; background: rgba(60, 10, 10, 0.6);
            border: 1px solid rgba(255, 100, 100, 0.4); color: #ffcccc; font-size: 18px; border-radius: 8px;
            width: 36px; height: 36px; cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center;
        }
        .toggle-sidebar-btn:hover { background: rgba(120, 20, 20, 0.8); }

        /* 右侧主聊天区 */
        .main-content { flex: 1; position: relative; height: 100vh; overflow: hidden; }
        .bg-image {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('bg.jpg');
            background-size: cover; background-position: center; filter: brightness(1.2) contrast(1.15) saturate(1.1);
            animation: bgBreath 18s ease-in-out infinite; z-index: 0;
        }
        @keyframes bgBreath { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
        .glow-overlay {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 55%;
            background: radial-gradient(ellipse at bottom, rgba(200,30,30,0.35) 0%, transparent 75%);
            mix-blend-mode: screen; animation: glowPulse 5s ease-in-out infinite alternate; z-index: 1;
        }
        @keyframes glowPulse { 0% { opacity: 0.5; } 100% { opacity: 1; } }
        
        .chat-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(15, 5, 5, 0.25);
            backdrop-filter: blur(2px); display: flex; flex-direction: column; z-index: 10;
        }
        .chat-header { padding: 20px 30px; background: linear-gradient(180deg, rgba(60,5,5,0.6) 0%, transparent 100%); border-bottom: 1px solid rgba(200,60,60,0.2); text-align: center; position: relative; flex-shrink: 0; }
        .chat-header h1 { color: #fff0f0; font-size: 24px; letter-spacing: 10px; font-weight: 300; text-shadow: 0 0 15px rgba(255,60,60,0.8); }
        .chat-header .subtitle { display: block; font-size: 12px; letter-spacing: 5px; color: rgba(255,180,180,0.7); margin-top: 6px; font-style: italic; }

        .settings-btn { position: absolute; right: 20px; top: 20px; background: rgba(60, 10, 10, 0.6); border: 1px solid rgba(255, 100, 100, 0.4); color: #ffcccc; font-size: 20px; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; transition: 0.3s; z-index: 20; display: flex; justify-content: center; align-items: center; }
        .settings-btn:hover { background: rgba(120, 20, 20, 0.8); transform: rotate(90deg); }

        .settings-panel { position: absolute; right: -350px; top: 0; width: 320px; height: 100vh; background: rgba(20, 5, 5, 0.95); backdrop-filter: blur(15px); border-left: 1px solid rgba(200, 60, 60, 0.4); z-index: 30; transition: right 0.4s ease; padding: 30px 20px; overflow-y: auto; }
        .settings-panel.open { right: 0; }
        .setting-group { margin-bottom: 25px; }
        .setting-group h3 { color: #ffaaaa; font-size: 14px; letter-spacing: 2px; margin-bottom: 15px; border-bottom: 1px solid rgba(255,100,100,0.3); padding-bottom: 5px; }
        
        .model-select { width: 100%; padding: 10px; margin-bottom: 15px; background: rgba(40, 10, 10, 0.8); border: 1px solid rgba(255, 100, 100, 0.4); border-radius: 8px; color: #ffdddd; font-size: 13px; outline: none; }
        .toggle-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; color: #e0d0d0; font-size: 13px; }
        .toggle-switch { width: 44px; height: 24px; background: #3a1a1a; border-radius: 12px; cursor: pointer; transition: 0.3s; position: relative; }
        .toggle-switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; background: #888; border-radius: 50%; transition: 0.3s; }
        .toggle-switch.active { background: rgba(180, 30, 30, 0.8); }
        .toggle-switch.active::after { left: 22px; background: #fff; }
        
        .slider-row { margin-bottom: 15px; color: #e0d0d0; font-size: 13px; }
        .slider-row label { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .slider-row input[type="range"] { width: 100%; height: 4px; background: rgba(255,255,255,0.1); -webkit-appearance: none; outline: none; }
        .slider-row input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #ff5555; border-radius: 50%; }

        .chat-box { flex: 1; padding: 30px 50px; overflow-y: auto; display: flex; flex-direction: column; gap: 24px; }
        .chat-box::-webkit-scrollbar { width: 4px; }
        .chat-box::-webkit-scrollbar-thumb { background: rgba(220,60,60,0.5); }
        
        .message { max-width: 75%; padding: 18px 26px; border-radius: 18px; font-size: 15px; line-height: 2.0; word-wrap: break-word; animation: fadeIn 0.5s ease; text-shadow: 0 2px 4px rgba(0,0,0,0.9); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .message.ai { align-self: flex-start; background: linear-gradient(135deg, rgba(80,15,15,0.5) 0%, rgba(40,5,5,0.4) 100%); color: #f5e6e6; border: 1px solid rgba(255,100,100,0.4); border-bottom-left-radius: 4px; backdrop-filter: blur(4px); }
        .message.ai::before { content: '❀'; position: absolute; top: -10px; left: -6px; color: rgba(255,80,80,0.9); font-size: 16px; }
        .message.ai .action { color: #c8c8c8; font-style: italic; font-size: 14px; opacity: 0.85; }
        .message.user { align-self: flex-end; background: linear-gradient(135deg, rgba(200,40,40,0.55) 0%, rgba(140,15,15,0.5) 100%); color: #fff; border: 1px solid rgba(255,140,140,0.5); border-bottom-right-radius: 4px; backdrop-filter: blur(4px); }

        /* 搜索来源面板 */
        .meta-panel { align-self: flex-start; max-width: 75%; margin-top: -12px; padding: 10px 16px; border-radius: 12px; background: rgba(20, 0, 0, 0.6); border: 1px solid rgba(255, 100, 100, 0.2); font-size: 12px; color: #aaa; backdrop-filter: blur(4px); animation: fadeIn 0.5s ease; }
        .meta-panel summary { cursor: pointer; color: #ff8888; font-weight: bold; outline: none; list-style: none; display: flex; align-items: center; gap: 6px; }
        .meta-panel summary::-webkit-details-marker { display: none; }
        .meta-panel summary::before { content: '▸'; transition: 0.2s; }
        .meta-panel[open] summary::before { transform: rotate(90deg); }
        .meta-content { margin-top: 10px; padding-top: 10px; border-top: 1px dashed rgba(255,100,100,0.2); line-height: 1.6; max-height: 200px; overflow-y: auto; }
        .citation-item { margin-bottom: 8px; }
        .citation-item a { color: #ffaaaa; text-decoration: none; border-bottom: 1px dotted #ffaaaa; }
        .citation-snippet { color: #888; font-size: 11px; margin-top: 2px; display: block; }
        .reasoning-text { color: #999; font-style: italic; white-space: pre-wrap; }

        .input-area { padding: 20px 50px 30px; background: linear-gradient(0deg, rgba(50,5,5,0.7) 0%, transparent 100%); border-top: 1px solid rgba(200,60,60,0.3); display: flex; gap: 16px; flex-shrink: 0; }
        .input-area input { flex: 1; padding: 14px 24px; border: 1px solid rgba(255,100,100,0.4); border-radius: 30px; background: rgba(30,5,5,0.5); color: #fff; font-size: 15px; outline: none; backdrop-filter: blur(4px); }
        .input-area input::placeholder { color: rgba(255,180,180,0.5); font-style: italic; }
        .input-area button { padding: 0 36px; border: 1px solid rgba(255,140,140,0.5); border-radius: 30px; background: linear-gradient(135deg, rgba(180,30,30,0.8), rgba(90,10,10,0.8)); color: #fff; font-size: 15px; cursor: pointer; backdrop-filter: blur(4px); }
    </style>
</head>
<body>
    <audio id="bgm" loop preload="auto"><source src="bgm.mp3" type="audio/mpeg"></audio>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header"><button class="new-topic-btn" id="newTopicBtn">+ 开启新话题</button></div>
        <div class="topic-list" id="topicList"></div>
    </div>

    <div class="main-content">
        <button class="toggle-sidebar-btn" id="toggleSidebarBtn">☰</button>
        <div class="bg-image"></div>
        <div class="glow-overlay"></div>
        
        <div class="chat-container">
            <div class="chat-header"><h1>弗洛洛</h1><span class="subtitle">Phrolova · 残星会会监</span></div>
            <button class="settings-btn" id="settingsBtn">⚙️</button>

            <div class="settings-panel" id="settingsPanel">
                <div class="setting-group">
                    <h3>回复风格</h3>
                    <div class="slider-row"><label>模型选择</label><select id="modelSelect" class="model-select"><option value="openrouter/free">加载中...</option></select></div>
                    <div class="slider-row"><label>Temperature <span id="tempVal">0.9</span></label><input type="range" id="tempSlider" min="0" max="2" step="0.1" value="0.9"></div>
                    <div class="slider-row"><label>Max Tokens <span id="maxTokVal">1500</span></label><input type="range" id="maxTokSlider" min="100" max="3000" step="100" value="1500"></div>
                </div>
                <div class="setting-group">
                    <h3>输出控制</h3>
                    <div class="toggle-row"><span>屏蔽思考过程</span><div class="toggle-switch active" id="toggleAntiThinking"></div></div>
                    <div class="toggle-row"><span>禁止自导自演</span><div class="toggle-switch active" id="toggleAntiInterrupt"></div></div>
                </div>
                <div class="setting-group">
                    <h3>联网能力</h3>
                    <div class="toggle-row"><span>允许自主联网搜索</span><div class="toggle-switch" id="toggleSearch"></div></div>
                </div>
            </div>

            <div class="chat-box" id="chatBox"></div>
            <div class="input-area">
                <input type="text" id="userInput" placeholder="对弗洛洛说些什么……" autocomplete="off">
                <button id="sendBtn">发送</button>
            </div>
        </div>
    </div>

    <script>
        // 🌟 智能兼容：如果是双击打开的（file:），自动指向 3000 端口；如果是网址，走相对路径
        const API_BASE = window.location.protocol === 'file:' ? 'http://localhost:3000' : '';

        let topics = [];
        try {
            let raw = localStorage.getItem('frolova_topics');
            if (raw) topics = JSON.parse(raw);
            if (!Array.isArray(topics)) topics = [];
        } catch (e) { localStorage.removeItem('frolova_topics'); }

        let currentTopicId = localStorage.getItem('frolova_current_id');
        if (topics.length === 0) createNewTopic();
        else if (!currentTopicId || !topics.find(t => t.id === currentTopicId)) { currentTopicId = topics[0].id; saveData(); }

        function saveData() {
            localStorage.setItem('frolova_topics', JSON.stringify(topics));
            localStorage.setItem('frolova_current_id', currentTopicId);
        }

        function createNewTopic() {
            const newTopic = {
                id: Date.now().toString(), title: '新的话题',
                messages: [{ role: 'ai', content: '（她缓缓抬起眼眸，彼岸花的影子在眼底一闪而过）你来了。这里的风，还带着上一个世界的气息。' }]
            };
            topics.unshift(newTopic);
            currentTopicId = newTopic.id;
            saveData(); renderTopicList(); renderChat();
        }

        const topicList = document.getElementById('topicList');
        const chatBox = document.getElementById('chatBox');

        function renderTopicList() {
            topicList.innerHTML = '';
            topics.forEach(topic => {
                const div = document.createElement('div');
                div.className = `topic-item ${topic.id === currentTopicId ? 'active' : ''}`;
                div.textContent = topic.title;
                div.onclick = () => { currentTopicId = topic.id; saveData(); renderTopicList(); renderChat(); };
                topicList.appendChild(div);
            });
        }

        function formatAIText(rawText) {
            let html = rawText.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            html = html.replace(/（[^）]*）/g, '<span class="action">$&</span>').replace(/\([^)]*\)/g, '<span class="action">$&</span>');
            html = html.replace(/\n/g, '<br>').replace(/(<br>\s*){2,}/g, '<br><br>');
            return html;
        }

        function renderChat() {
            chatBox.innerHTML = '';
            const currentTopic = topics.find(t => t.id === currentTopicId);
            if (!currentTopic) return;

            currentTopic.messages.forEach(msg => {
                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${msg.role}`;
                if (msg.role === 'ai') {
                    msgDiv.innerHTML = formatAIText(msg.content);
                } else {
                    msgDiv.textContent = msg.content;
                }
                chatBox.appendChild(msgDiv);

                if (msg.citations && msg.citations.length > 0 || msg.reasoning) {
                    const panel = document.createElement('details');
                    panel.className = 'meta-panel';
                    panel.innerHTML = `<summary>🌐 搜索来源与思考过程</summary><div class="meta-content"></div>`;
                    const content = panel.querySelector('.meta-content');
                    
                    if (msg.reasoning) content.innerHTML += `<div><strong>🧠 深度思考</strong><div class="reasoning-text">${msg.reasoning}</div></div>`;
                    if (msg.citations && msg.citations.length > 0) {
                        let cHtml = `<div><strong>🌐 搜索来源</strong>`;
                        msg.citations.forEach(c => {
                            cHtml += `<div class="citation-item"><a href="${c.url}" target="_blank">${c.title || c.url}</a>`;
                            if (c.content) cHtml += `<span class="citation-snippet">${c.content.substring(0, 100)}...</span>`;
                            cHtml += `</div>`;
                        });
                        content.innerHTML += cHtml;
                    }
                    chatBox.appendChild(panel);
                }
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendMessageToCurrentTopic(role, content, citations = [], reasoning = '') {
            const currentTopic = topics.find(t => t.id === currentTopicId);
            currentTopic.messages.push({ role, content, citations, reasoning });
            saveData(); renderChat();
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const bgm = document.getElementById('bgm');
            document.addEventListener('click', function playBGM() { bgm.play().then(() => document.removeEventListener('click', playBGM)).catch(e => console.log('等待交互')); });

            renderTopicList(); renderChat();

            document.getElementById('toggleSidebarBtn').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));
            document.getElementById('newTopicBtn').addEventListener('click', () => {
                createNewTopic();
                if(window.innerWidth < 768) document.getElementById('sidebar').classList.remove('open');
            });

            const modelSelect = document.getElementById('modelSelect');
            try {
                const response = await fetch(API_BASE + '/api/models');
                const data = await response.json();
                modelSelect.innerHTML = ''; 
                if (data.models && data.models.length > 0) {
                    data.models.forEach(m => {
                        const opt = document.createElement('option');
                        opt.value = m.id; opt.textContent = `${m.name}${m.supportsTools ? ' 🛠️' : ''}`;
                        modelSelect.appendChild(opt);
                    });
                } else modelSelect.innerHTML = '<option value="openrouter/free">自动选择</option>';
            } catch (e) { modelSelect.innerHTML = '<option value="openrouter/free">获取失败</option>'; }

            const settingsBtn = document.getElementById('settingsBtn');
            const settingsPanel = document.getElementById('settingsPanel');
            settingsBtn.addEventListener('click', (e) => { e.stopPropagation(); settingsPanel.classList.toggle('open'); });
            settingsPanel.addEventListener('click', (e) => e.stopPropagation());
            document.addEventListener('click', () => settingsPanel.classList.remove('open'));
            document.querySelectorAll('.toggle-switch').forEach(t => t.addEventListener('click', function() { this.classList.toggle('active'); }));
            ['temp', 'maxTok'].forEach(id => {
                const slider = document.getElementById(id + 'Slider'), display = document.getElementById(id + 'Val');
                if (slider && display) slider.addEventListener('input', () => display.textContent = slider.value);
            });
        });

        function getSettings() {
            return {
                model: document.getElementById('modelSelect').value,
                antiThinking: document.getElementById('toggleAntiThinking').classList.contains('active'),
                antiInterrupt: document.getElementById('toggleAntiInterrupt').classList.contains('active'),
                enableSearch: document.getElementById('toggleSearch').classList.contains('active'),
                temperature: parseFloat(document.getElementById('tempSlider').value),
                maxTokens: parseInt(document.getElementById('maxTokSlider').value)
            };
        }

        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        async function sendMessage() {
            const text = userInput.value.trim();
            if (text === '') return;

            const currentTopic = topics.find(t => t.id === currentTopicId);
            const isFirstMessage = currentTopic.messages.filter(m => m.role === 'user').length === 0;

            appendMessageToCurrentTopic('user', text);
            userInput.value = '';
            
            const tempDiv = document.createElement('div');
            tempDiv.className = 'message ai';
            tempDiv.textContent = '（她沉默了片刻，指尖轻轻拂过虚空……）';
            chatBox.appendChild(tempDiv); chatBox.scrollTop = chatBox.scrollHeight;

            const settings = getSettings();
            
            let finalMessage = text;
            if (isFirstMessage) {
                finalMessage += "\n\n(系统暗号：请你在回复的最后，用【标题：不超过6个字的短语】为这次对话总结一个标题。)";
            }

            const historyForAPI = currentTopic.messages.slice(0, -1).slice(-20).map(m => ({
                role: m.role === 'ai' ? 'assistant' : 'user', content: m.content
            }));

            try {
                const response = await fetch(API_BASE + '/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: finalMessage, settings: settings, model: settings.model, history: historyForAPI })
                });
                const data = await response.json();
                
                chatBox.removeChild(tempDiv);

                let aiReply = data.reply;
                const titleMatch = aiReply.match(/【标题：(.*?)】/);
                if (titleMatch) {
                    currentTopic.title = titleMatch[1];
                    aiReply = aiReply.replace(titleMatch[0], '').trim();
                    renderTopicList();
                }

                appendMessageToCurrentTopic('ai', aiReply, data.citations || [], data.reasoning || '');
            } catch (error) {
                chatBox.removeChild(tempDiv);
                appendMessageToCurrentTopic('ai', '（她似乎被某种力量干扰了，暂时无法回应……）');
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>
