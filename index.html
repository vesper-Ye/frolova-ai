<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>弗洛洛</title>
    <style>
        /* ================= 全局设置 ================= */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%; height: 100%; overflow: hidden;
            font-family: 'Times New Roman', 'Microsoft YaHei', serif;
            background-color: #0a0505;
        }

        /* ================= 背景与特效 ================= */
        .scene { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        .bg-image {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('bg.jpg');
            background-size: cover; background-position: center;
            filter: brightness(1.2) contrast(1.15) saturate(1.1);
            animation: bgBreath 18s ease-in-out infinite;
            z-index: 0; will-change: transform;
        }
        @keyframes bgBreath { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
        .glow-overlay {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 55%;
            background: radial-gradient(ellipse at bottom, rgba(200,30,30,0.35) 0%, rgba(120,10,10,0.1) 40%, transparent 75%);
            mix-blend-mode: screen; animation: glowPulse 5s ease-in-out infinite alternate;
            pointer-events: none; z-index: 1;
        }
        @keyframes glowPulse { 0% { opacity: 0.5; } 100% { opacity: 1; } }
        .petal {
            position: absolute; background: radial-gradient(circle, #ff6666, #8b0000);
            border-radius: 50% 0 50% 50%; opacity: 0.85; animation: fall linear infinite;
            pointer-events: none; box-shadow: 0 0 8px rgba(255,50,50,0.8); z-index: 2;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.85; } 90% { opacity: 0.85; }
            100% { transform: translateY(110vh) translateX(70px) rotate(360deg); opacity: 0; }
        }
        .petal:nth-child(1) { left: 5%; width: 9px; height: 9px; animation-duration: 7s; animation-delay: 0s; }
        .petal:nth-child(2) { left: 18%; width: 13px; height: 13px; animation-duration: 10s; animation-delay: 1.8s; }
        .petal:nth-child(3) { left: 33%; width: 7px; height: 7px; animation-duration: 6s; animation-delay: 3.2s; }
        .petal:nth-child(4) { left: 52%; width: 11px; height: 11px; animation-duration: 8.5s; animation-delay: 2.2s; }
        .petal:nth-child(5) { left: 68%; width: 8px; height: 8px; animation-duration: 7.5s; animation-delay: 4.8s; }
        .petal:nth-child(6) { left: 82%; width: 14px; height: 14px; animation-duration: 11s; animation-delay: 1.2s; }
        .petal:nth-child(7) { left: 44%; width: 6px; height: 6px; animation-duration: 6.8s; animation-delay: 5.5s; }
        .petal:nth-child(8) { left: 62%; width: 10px; height: 10px; animation-duration: 9s; animation-delay: 3.8s; }
        .ember {
            position: absolute; background: #ffcc44; border-radius: 50%; opacity: 0;
            box-shadow: 0 0 12px #ff4500, 0 0 25px #cc0000;
            animation: floatUp linear infinite; pointer-events: none; z-index: 2;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) translateX(0) scale(0.4); opacity: 0; }
            20% { opacity: 1; } 80% { opacity: 0.7; }
            100% { transform: translateY(-10vh) translateX(-40px) scale(1.3); opacity: 0; }
        }
        .ember:nth-child(9)  { left: 8%;  width: 4px; height: 4px; animation-duration: 5s; animation-delay: 0s; }
        .ember:nth-child(10) { left: 28%; width: 5px; height: 5px; animation-duration: 7s; animation-delay: 2.5s; }
        .ember:nth-child(11) { left: 48%; width: 3px; height: 3px; animation-duration: 4.5s; animation-delay: 4.5s; }
        .ember:nth-child(12) { left: 72%; width: 6px; height: 6px; animation-duration: 6.5s; animation-delay: 1.5s; }
        .ember:nth-child(13) { left: 88%; width: 4px; height: 4px; animation-duration: 5.5s; animation-delay: 3.5s; }
        .ember:nth-child(14) { left: 58%; width: 7px; height: 7px; animation-duration: 8s; animation-delay: 5.5s; }

        /* ================= 聊天界面 ================= */
        .chat-container {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 5, 5, 0.25); backdrop-filter: blur(2px);
            display: flex; flex-direction: column; z-index: 10;
        }
        .chat-header {
            padding: 20px 30px; background: linear-gradient(180deg, rgba(60,5,5,0.6) 0%, rgba(30,0,0,0.1) 100%);
            border-bottom: 1px solid rgba(200,60,60,0.2); text-align: center; position: relative; flex-shrink: 0;
        }
        .chat-header h1 {
            color: #fff0f0; font-size: 24px; letter-spacing: 10px; font-weight: 300;
            text-shadow: 0 0 15px rgba(255,60,60,0.8), 0 0 40px rgba(180,0,0,0.6);
        }
        .chat-header .subtitle { display: block; font-size: 12px; letter-spacing: 5px; color: rgba(255,180,180,0.7); margin-top: 6px; font-style: italic; }

        /* 设置按钮 */
        .settings-btn {
            position: absolute; right: 20px; top: 20px;
            background: rgba(60, 10, 10, 0.6); border: 1px solid rgba(255, 100, 100, 0.4);
            color: #ffcccc; font-size: 20px; border-radius: 50%; width: 40px; height: 40px;
            cursor: pointer; transition: 0.3s; z-index: 20; backdrop-filter: blur(4px);
            display: flex; justify-content: center; align-items: center;
        }
        .settings-btn:hover { background: rgba(120, 20, 20, 0.8); transform: rotate(90deg); }

        /* 设置面板 */
        .settings-panel {
            position: absolute; right: -350px; top: 0; width: 320px; height: 100vh;
            background: rgba(20, 5, 5, 0.95); backdrop-filter: blur(15px);
            border-left: 1px solid rgba(200, 60, 60, 0.4); z-index: 30;
            transition: right 0.4s ease; padding: 30px 20px; overflow-y: auto;
            box-shadow: -10px 0 30px rgba(0,0,0,0.8);
        }
        .settings-panel.open { right: 0; }
        .settings-panel::-webkit-scrollbar { width: 4px; }
        .settings-panel::-webkit-scrollbar-thumb { background: rgba(200,60,60,0.5); border-radius: 2px; }

        .setting-group { margin-bottom: 25px; }
        .setting-group h3 { color: #ffaaaa; font-size: 14px; letter-spacing: 2px; margin-bottom: 15px; border-bottom: 1px solid rgba(255,100,100,0.3); padding-bottom: 5px; }

        .model-select {
            width: 100%; padding: 10px; margin-bottom: 15px;
            background: rgba(40, 10, 10, 0.8); border: 1px solid rgba(255, 100, 100, 0.4);
            border-radius: 8px; color: #ffdddd; font-size: 13px; outline: none; cursor: pointer;
            font-family: 'Times New Roman', 'Microsoft YaHei', serif;
        }
        .model-select option { background: #200505; color: #ffdddd; }

        .toggle-row { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 14px; color: #e0d0d0; font-size: 13px; 
        }
        .toggle-switch {
            width: 44px; height: 24px; background: #3a1a1a;
            border-radius: 12px; cursor: pointer; transition: 0.3s;
            border: 1px solid rgba(255,100,100,0.2);
            position: relative; flex-shrink: 0;
        }
        .toggle-switch::after {
            content: ''; position: absolute; top: 2px; left: 2px; 
            width: 18px; height: 18px; background: #888; 
            border-radius: 50%; transition: 0.3s;
        }
        .toggle-switch.active { background: rgba(180, 30, 30, 0.8); border-color: #ff5555; }
        .toggle-switch.active::after { 
            left: 22px; background: #fff; 
            box-shadow: 0 0 10px rgba(255, 50, 50, 1); 
        }

        .slider-row { margin-bottom: 15px; color: #e0d0d0; font-size: 13px; }
        .slider-row label { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .slider-row input[type="range"] {
            width: 100%; height: 4px; background: rgba(255,255,255,0.1);
            border-radius: 2px; -webkit-appearance: none; outline: none;
        }
        .slider-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 14px; height: 14px; background: #ff5555;
            border-radius: 50%; cursor: pointer; box-shadow: 0 0 8px rgba(255,0,0,0.8);
        }

        /* 聊天记录 */
        .chat-box { flex: 1; padding: 30px 50px; overflow-y: auto; display: flex; flex-direction: column; gap: 24px; }
        .chat-box::-webkit-scrollbar { width: 4px; }
        .chat-box::-webkit-scrollbar-thumb { background: rgba(220,60,60,0.5); border-radius: 2px; }
        
        .message {
            max-width: 75%; padding: 18px 26px; border-radius: 18px; font-size: 15px; line-height: 2.0;
            word-wrap: break-word; animation: fadeIn 0.5s ease; position: relative; letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        
        .message.ai {
            align-self: flex-start; background: linear-gradient(135deg, rgba(80,15,15,0.5) 0%, rgba(40,5,5,0.4) 100%);
            color: #f5e6e6; border: 1px solid rgba(255,100,100,0.4); border-bottom-left-radius: 4px;
            box-shadow: 0 0 25px rgba(150,0,0,0.25), inset 0 1px 0 rgba(255,200,200,0.15);
            backdrop-filter: blur(4px);
        }
        .message.ai::before {
            content: '❀'; position: absolute; top: -10px; left: -6px; color: rgba(255,80,80,0.9);
            font-size: 16px; text-shadow: 0 0 12px rgba(255,0,0,1);
            animation: petalGlow 3s ease-in-out infinite alternate;
        }
        @keyframes petalGlow { 0% { opacity: 0.6; } 100% { opacity: 1; text-shadow: 0 0 20px rgba(255,50,50,1); } }
        
        .message.ai .action {
            color: #c8c8c8;
            font-style: italic;
            font-size: 14px;
            opacity: 0.85;
        }

        .message.user {
            align-self: flex-end; background: linear-gradient(135deg, rgba(200,40,40,0.55) 0%, rgba(140,15,15,0.5) 100%);
            color: #fff; border: 1px solid rgba(255,140,140,0.5); border-bottom-right-radius: 4px;
            box-shadow: 0 0 25px rgba(220,40,40,0.4), inset 0 1px 0 rgba(255,255,255,0.2); backdrop-filter: blur(4px);
        }

        /* 搜索来源与思考过程面板 */
        .meta-panel {
            align-self: flex-start; max-width: 75%; margin-top: -12px;
            padding: 10px 16px; border-radius: 12px;
            background: rgba(20, 0, 0, 0.4); border: 1px solid rgba(255, 100, 100, 0.2);
            font-size: 12px; color: #aaa; backdrop-filter: blur(4px);
            animation: fadeIn 0.5s ease;
        }
        .meta-panel summary {
            cursor: pointer; color: #ff8888; font-weight: bold; outline: none;
            list-style: none; display: flex; align-items: center; gap: 6px;
        }
        .meta-panel summary::-webkit-details-marker { display: none; }
        .meta-panel summary::before { content: '▸'; transition: 0.2s; }
        .meta-panel[open] summary::before { transform: rotate(90deg); }
        .meta-content {
            margin-top: 10px; padding-top: 10px; border-top: 1px dashed rgba(255,100,100,0.2);
            line-height: 1.6; max-height: 200px; overflow-y: auto;
        }
        .meta-content::-webkit-scrollbar { width: 3px; }
        .meta-content::-webkit-scrollbar-thumb { background: rgba(255,100,100,0.3); }
        .citation-item { margin-bottom: 8px; }
        .citation-item a { color: #ffaaaa; text-decoration: none; border-bottom: 1px dotted #ffaaaa; }
        .citation-item a:hover { color: #fff; }
        .citation-snippet { color: #888; font-size: 11px; margin-top: 2px; display: block; }
        .reasoning-text { color: #999; font-style: italic; white-space: pre-wrap; }

        /* 输入区 */
        .input-area {
            padding: 20px 50px 30px; background: linear-gradient(0deg, rgba(50,5,5,0.7) 0%, rgba(15,1,1,0.1) 100%);
            border-top: 1px solid rgba(200,60,60,0.3); display: flex; gap: 16px; flex-shrink: 0; position: relative;
        }
        .input-area input {
            flex: 1; padding: 14px 24px; border: 1px solid rgba(255,100,100,0.4); border-radius: 30px;
            background: rgba(30,5,5,0.5); color: #fff; font-size: 15px; outline: none;
            transition: all 0.4s ease; font-family: 'Times New Roman', 'Microsoft YaHei', serif;
            letter-spacing: 0.5px; backdrop-filter: blur(4px);
        }
        .input-area input:focus {
            background: rgba(50,10,10,0.7); border-color: rgba(255,120,120,0.8);
            box-shadow: 0 0 25px rgba(200,40,40,0.5), inset 0 0 15px rgba(150,0,0,0.3);
        }
        .input-area input::placeholder { color: rgba(255,180,180,0.5); font-style: italic; }
        .input-area button {
            padding: 0 36px; border: 1px solid rgba(255,140,140,0.5); border-radius: 30px;
            background: linear-gradient(135deg, rgba(180,30,30,0.8), rgba(90,10,10,0.8));
            color: #fff; font-size: 15px; cursor: pointer; transition: all 0.4s ease;
            letter-spacing: 5px; font-family: 'Times New Roman', 'STSong', serif;
            box-shadow: 0 0 20px rgba(180,30,30,0.5), inset 0 1px 0 rgba(255,200,200,0.2);
            position: relative; overflow: hidden; backdrop-filter: blur(4px);
        }
        .input-area button:hover {
            transform: scale(1.04); background: linear-gradient(135deg, rgba(220,50,50,0.9), rgba(120,15,15,0.9));
            box-shadow: 0 0 35px rgba(255,50,50,0.7), inset 0 1px 0 rgba(255,220,220,0.3);
        }
        .input-area button:active { transform: scale(0.97); }
    </style>
</head>
<body>
    <audio id="bgm" loop preload="auto"><source src="bgm.mp3" type="audio/mpeg"></audio>

    <div class="scene">
        <div class="bg-image"></div>
        <div class="glow-overlay"></div>
        <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
        <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
        <div class="ember"></div><div class="ember"></div><div class="ember"></div>
        <div class="ember"></div><div class="ember"></div><div class="ember"></div>

        <div class="chat-container">
            <div class="chat-header">
                <h1>弗洛洛</h1>
                <span class="subtitle">Phrolova · 残星会会监</span>
            </div>
            <button class="settings-btn" id="settingsBtn">⚙️</button>

            <!-- 设置面板 -->
            <div class="settings-panel" id="settingsPanel">
                <div class="setting-group">
                    <h3>回复风格</h3>
                    <div class="slider-row">
                        <label>模型选择</label>
                        <select id="modelSelect" class="model-select">
                            <option value="openrouter/free">正在获取可用模型...</option>
                        </select>
                    </div>
                    <div class="slider-row">
                        <label>Temperature (温度) <span id="tempVal">0.9</span></label>
                        <input type="range" id="tempSlider" min="0" max="2" step="0.1" value="0.9">
                    </div>
                    <div class="slider-row">
                        <label>Max Tokens (最大长度) <span id="maxTokVal">1500</span></label>
                        <input type="range" id="maxTokSlider" min="100" max="3000" step="100" value="1500">
                    </div>
                </div>

                <div class="setting-group">
                    <h3>输出控制</h3>
                    <div class="toggle-row">
                        <span>屏蔽思考过程</span>
                        <div class="toggle-switch active" id="toggleAntiThinking"></div>
                    </div>
                    <div class="toggle-row">
                        <span>禁止自导自演</span>
                        <div class="toggle-switch active" id="toggleAntiInterrupt"></div>
                    </div>
                </div>

                <div class="setting-group">
                    <h3>联网能力</h3>
                    <div class="toggle-row">
                        <span>允许自主联网搜索</span>
                        <div class="toggle-switch" id="toggleSearch"></div>
                    </div>
                </div>
            </div>

            <div class="chat-box" id="chatBox">
                <div class="message ai">
                    （她缓缓抬起眼眸，彼岸花的影子在眼底一闪而过）你来了。这里的风，还带着上一个世界的气息。
                </div>
            </div>

            <div class="input-area">
                <input type="text" id="userInput" placeholder="对弗洛洛说些什么……" autocomplete="off">
                <button id="sendBtn">发送</button>
            </div>
        </div>
    </div>

    <script>
        // ================= 背景音乐与模型列表 =================
        document.addEventListener('DOMContentLoaded', async () => {
            const bgm = document.getElementById('bgm');
            function playBGM() { bgm.play().then(() => document.removeEventListener('click', playBGM)).catch(e => console.log('等待交互')); }
            document.addEventListener('click', playBGM);

            const modelSelect = document.getElementById('modelSelect');
            try {
                // 🌟 修改：相对路径
                const response = await fetch('/api/models');
                const data = await response.json();
                modelSelect.innerHTML = ''; 
                if (data.models && data.models.length > 0) {
                    data.models.forEach(model => {
                        const option = document.createElement('option');
                        option.value = model.id;
                        const toolTag = model.supportsTools ? ' 🛠️' : '';
                        const contextStr = model.context ? ` [${model.context}]` : '';
                        option.textContent = `${model.name}${contextStr}${toolTag}`;
                        modelSelect.appendChild(option);
                    });
                } else {
                    modelSelect.innerHTML = '<option value="openrouter/free">未找到免费模型</option>';
                }
            } catch (error) {
                modelSelect.innerHTML = '<option value="openrouter/free">获取失败</option>';
            }
        });

        // ================= 设置面板 =================
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsPanel = document.getElementById('settingsPanel');
        settingsBtn.addEventListener('click', (e) => { e.stopPropagation(); settingsPanel.classList.toggle('open'); });
        settingsPanel.addEventListener('click', (e) => e.stopPropagation());
        document.addEventListener('click', () => { if (settingsPanel.classList.contains('open')) settingsPanel.classList.remove('open'); });
        document.querySelectorAll('.toggle-switch').forEach(toggle => {
            toggle.addEventListener('click', function() { this.classList.toggle('active'); });
        });

        const sliders = ['temp', 'maxTok'];
        sliders.forEach(id => {
            const slider = document.getElementById(id + 'Slider');
            const valDisplay = document.getElementById(id + 'Val');
            if (slider && valDisplay) slider.addEventListener('input', () => valDisplay.textContent = slider.value);
        });

        function getSettings() {
            return {
                model: document.getElementById('modelSelect').value,
                antiThinking: document.getElementById('toggleAntiThinking').classList.contains('active'),
                antiInterrupt: document.getElementById('toggleAntiInterrupt').classList.contains('active'),
                enableSearch: document.getElementById('toggleSearch').classList.contains('active'),
                temperature: parseFloat(document.getElementById('tempSlider').value),
                maxTokens: parseInt(document.getElementById('maxTokSlider').value)
            };
        }

        // ================= 聊天逻辑 =================
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        function formatAIText(rawText) {
            let html = rawText
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
            html = html.replace(/（[^）]*）/g, '<span class="action">$&</span>');
            html = html.replace(/\([^)]*\)/g, '<span class="action">$&</span>');
            html = html.replace(/\n/g, '<br>');
            html = html.replace(/(<br>\s*){2,}/g, '<br><br>');
            html = html.replace(/horizon/gi, '地平线');
            html = html.replace(/curiosity/gi, '好奇');
            html = html.replace(/subtly/gi, '微妙地');
            return html;
        }

        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            if (sender === 'ai') {
                msgDiv.innerHTML = formatAIText(text);
            } else {
                msgDiv.textContent = text;
            }
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function renderMeta(citations, reasoning) {
            if (!citations.length && !reasoning) return;

            const panel = document.createElement('details');
            panel.className = 'meta-panel';
            
            const summary = document.createElement('summary');
            summary.textContent = `🌐 搜索来源与思考过程`;
            panel.appendChild(summary);

            const content = document.createElement('div');
            content.className = 'meta-content';

            if (reasoning) {
                const rDiv = document.createElement('div');
                rDiv.innerHTML = `<strong>🧠 深度思考</strong><div class="reasoning-text">${reasoning}</div>`;
                content.appendChild(rDiv);
            }

            if (citations.length > 0) {
                const cDiv = document.createElement('div');
                cDiv.innerHTML = `<strong>🌐 搜索来源</strong>`;
                citations.forEach(c => {
                    const item = document.createElement('div');
                    item.className = 'citation-item';
                    item.innerHTML = `<a href="${c.url}" target="_blank">${c.title || c.url}</a>`;
                    if (c.content) {
                        const snippet = document.createElement('span');
                        snippet.className = 'citation-snippet';
                        snippet.textContent = c.content.substring(0, 120) + '...';
                        item.appendChild(snippet);
                    }
                    cDiv.appendChild(item);
                });
                content.appendChild(cDiv);
            }

            panel.appendChild(content);
            chatBox.appendChild(panel);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (text === '') return;

            addMessage(text, 'user');
            userInput.value = '';
            addMessage('（她沉默了片刻，指尖轻轻拂过虚空……）', 'ai');

            const settings = getSettings();

            try {
                // 🌟 修改：相对路径
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, settings: settings, model: settings.model })
                });
                const data = await response.json();
                
                chatBox.removeChild(chatBox.lastChild);
                addMessage(data.reply, 'ai');
                
                renderMeta(data.citations || [], data.reasoning || '');
                
            } catch (error) {
                chatBox.removeChild(chatBox.lastChild);
                addMessage('（她似乎被某种力量干扰了，暂时无法回应……）', 'ai');
                console.error('请求失败:', error);
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>
